services:
  - type: web
    name: sonora-downloader
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DOWNLOADER_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: YT_DLP_PATH
        value: yt-dlp
